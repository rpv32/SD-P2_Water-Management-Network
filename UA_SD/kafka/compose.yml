services:
  broker:
    image: apache/kafka:3.9.0
    container_name: broker
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:29093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker:29092,EXTERNAL://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@broker:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data

  central:
    build:
      context: ..
      dockerfile: docker/dockerfile
    container_name: central
    stdin_open: true
    tty: true
    depends_on:
      - broker
    ports:
      - "5000:5000"
      - "8080:8080"
    environment:
      CENTRAL_PORT: "5000"
      WEB_PORT: "8080"
      KAFKA_BOOTSTRAP_SERVERS: "broker:29092"
      DB_PATH: "/data/wm.db"
    volumes:
      - central-data:/data
    entrypoint: ["java", "-Dorg.slf4j.simpleLogger.defaultLogLevel=warn" , "-cp", "app.jar", "WM_Central", "5000", "broker:29092"]

  monitor:
    build:
      context: ..
      dockerfile: docker/dockerfile
    container_name: monitor-ws01
    depends_on:
      - central
    entrypoint: ["java", "-cp", "app.jar", "WM_WS_M", "6000", "central", "5000", "WS-01"]
    ports:
      - "6000:6000"

  engine:
    build:
      context: ..
      dockerfile: docker/dockerfile
    container_name: engine-ws01
    stdin_open: true
    tty: true
    depends_on:
      - monitor
    entrypoint: ["java", "-Dorg.slf4j.simpleLogger.defaultLogLevel=warn", "-cp", "app.jar", "WM_Engine", "monitor-ws01", "6000", "WS-01", "broker:29092"]
    volumes:
      - engine-ws01-data:/data

  fo1:
    build:
      context: ..
      dockerfile: docker/dockerfile
    container_name: fo-op01
    stdin_open: true
    tty: true
    ports:
      - "8081:8081"
    environment:
      FO_WEB_PORT: "8081"
      FO_CONSOLE: "false"
    depends_on:
      - broker
    entrypoint: ["java", "-Dorg.slf4j.simpleLogger.defaultLogLevel=warn", "-cp", "app.jar", "WM_FO", "broker:29092", "OP-01"]
    volumes:
      - fo1-data:/app/archivos_fo
      - ./servicios:/servicios:ro

  fo2:
    build:
      context: ..
      dockerfile: docker/dockerfile
    container_name: fo-op02
    stdin_open: true
    tty: true
    ports:
      - "8082:8081"
    environment:
      FO_WEB_PORT: "8081"
      FO_CONSOLE: "false"
    depends_on:
      - broker
    entrypoint: ["java", "-Dorg.slf4j.simpleLogger.defaultLogLevel=warn", "-cp", "app.jar", "WM_FO", "broker:29092", "OP-02"]
    volumes:
      - fo2-data:/app/archivos_fo
      - ./servicios:/servicios:ro

volumes:
  central-data:
  fo1-data:
  fo2-data:
  kafka-data:
  engine-ws01-data: