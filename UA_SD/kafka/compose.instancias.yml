name: wm-instancias
services:
  monitor:
    image: ${WM_IMAGE:?Debe definir WM_IMAGE}
    entrypoint: ["java"]

  engine:
    image: ${WM_IMAGE:?Debe definir WM_IMAGE}
    entrypoint: ["java"]
    stdin_open: true
    tty: true

  fo:
    image: ${WM_IMAGE:?Debe definir WM_IMAGE}
    entrypoint: ["java"]
    stdin_open: true
    tty: true
    environment:
      FO_WEB_PORT: "8081"
      FO_CONSOLE: "false"
    volumes:
      - ./servicios:/servicios:ro