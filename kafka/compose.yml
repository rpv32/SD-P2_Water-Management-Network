services:
  broker:
    image: apache/kafka:3.9.0
    container_name: broker
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:29093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker:29092,EXTERNAL://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@broker:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

  central:
    build: .
    container_name: central
    depends_on:
      - broker
    ports:
      - "5000:5000"
      - "8080:8080"
    environment:
      CENTRAL_PORT: "5000"
      WEB_PORT: "8080"
      KAFKA_BOOTSTRAP_SERVERS: "broker:29092"
      DB_PATH: "/data/wm.db"
    volumes:
      - central-data:/data

  monitor:
    build: .
    container_name: monitor-ws01
    depends_on:
      - central
    command: ["WM_WS_M", "6000", "central", "5000", "WS-01"]
    ports:
      - "6000:6000"

  engine:
    build: .
    container_name: engine-ws01
    depends_on:
      - monitor
    command: ["Engine", "monitor-ws01", "6000", "WS-01", "broker:29092"]

  fo1:
    build: .
    container_name: fo-op01
    depends_on:
      - broker
    command: ["WM_FO", "broker:29092", "OP-01"]

  fo2:
    build: .
    container_name: fo-op02
    depends_on:
      - broker
    command: ["WM_FO", "broker:29092", "OP-02"]

volumes:
  central-data:
